name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill-tests:
    name: Skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/package-lock.json

      - name: Install skill runtime dependencies
        working-directory: skills
        run: npm ci

      - name: Test wiki engine
        working-directory: skills
        run: npm run test:wiki-engine

      - name: Test resume generator
        working-directory: skills
        run: npm run test:resume-generator

      - name: Test interview skill
        run: node --test skills/interview/tests/**/*.test.mjs

      - name: Test environment initialization
        run: node --test skills/env-init/tests/**/*.test.mjs

  web-editor:
    name: Web editor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/web-editor/package-lock.json

      - name: Install dependencies
        working-directory: skills/web-editor
        run: npm ci

      - name: Type-check
        working-directory: skills/web-editor
        run: npm run lint

      - name: Test
        working-directory: skills/web-editor
        run: npm test

      - name: Build
        working-directory: skills/web-editor
        run: npm run build
